<div class="cv-dialog" role="dialog" aria-label="Delete read comics">
<header class="cv-dialog-header"><h2>Delete read comics</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
<p class="cv-dialog-message">Are you sure you want to delete read comics? Select one option.</p>
    <div class="cv-dialog-option">
      <app-radio-button-input
        label="Read by everyone"
        [value]="'READ_BY_ALL'"
        (valueChange)="updateResponse($event)"
        [initValue]="'READ_BY_ALL'"
      ></app-radio-button-input>
    </div>
    <div class="cv-dialog-option">
      <app-radio-button-input
        label="Read by me and not on going by others"
        [value]="'READ_BY_ME_NOT_STARTED_BY_OTHER'"
        (valueChange)="updateResponse($event)"
        [initValue]="'READ_BY_ALL'"
      ></app-radio-button-input>
    </div>
    <div class="cv-dialog-option">
      <app-radio-button-input
        label="Read by me"
        [value]="'READ_BY_ME'"
        (valueChange)="updateResponse($event)"
        [initValue]="'READ_BY_ALL'"
      ></app-radio-button-input>
    </div>
  
</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-deactivated" (click)="cancel()">Cancel</button><button type="button" class="button-text button-error" (click)="confirm()">Delete comics</button></footer>
</div>
