<div class="whole-page-container cv-settings-page">
  <div class="cv-settings-layout">
    <header class="cv-settings-heading">
      <h1>Settings</h1>
      <p>Manage your library, appearance and integrations.</p>
    </header>
    <div class="cv-settings-sections">
    <section class="cv-settings-section"
      appHideRoles
      [appHideForRoles]="[Role.Requester, Role.Viewer]">
      <app-expander-button
      title="Library"
      (buttonClicked)="toggleShowServer()"
        [settingsStyle]="true"
        [open]="showServer"
        description="Storage, scanning and library maintenance"
        panelId="settings-showServer"
      ></app-expander-button>
      <div id="settings-showServer" [hidden]="!showServer">
      <div class="cv-settings-panel">
        <div
          appHideRoles
          [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
        >
          <app-input-text
            [(value)]="storagePath"
            (valueChange)="resetStorageStatus$.next()"
            title="Storage Path"
            id="storagePath"
          ></app-input-text>
        </div>
        <div
          appHideRoles
          [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
          class="cv-settings-submit"
        >
          <app-test-button
            test="storage"
            [payload]="storagePath"
            [resetStatus$]="resetStorageStatus$"
          ></app-test-button>
        </div>
        <div
          appHideRoles
          [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
          class="cv-settings-row"
        >
          <app-boolean-slider
            type="ngModel"
            [(value)]="scanArchives"
            (valueChange)="sendScanArchives()"
            label="Scan and extract archive files"
          ></app-boolean-slider>
          <app-help-button
            message="Extract comics from archive files (.zip, .rar) during scan"
          ></app-help-button>
        </div>
        <div
          appHideRoles
          [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
          class="cv-settings-row"
        >
          <app-boolean-slider
            type="ngModel"
            [(value)]="deleteArchives"
            (valueChange)="sendDeleteArchives()"
            label="Delete archive files after extraction"
          ></app-boolean-slider>
          <app-help-button
            message="After extracting comics from archives during scan, delete the original .zip or .rar file"
          ></app-help-button>
        </div>
        <div
          appHideRoles
          [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
          class="cv-settings-row"
        >
          <app-boolean-slider
            type="ngModel"
            [(value)]="autoMetadata"
            (valueChange)="sendAutoMetadata()"
            label="Autofill metadata from ComicVine"
          ></app-boolean-slider>
          <app-help-button
            message="When scanning a comic, automatically fetch metadata from ComicVine"
          ></app-help-button>
        </div>
        <div
          appHideRoles
          [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
          class="cv-settings-row"
        >
          <app-boolean-slider
            type="ngModel"
            [(value)]="generateNavigationThumbnails"
            (valueChange)="sendGenerateNavigationThumbnails()"
            label="Generate navigation thumbnails for comics"
          ></app-boolean-slider>
          <app-help-button
            message="When adding or scanning a comic, create page thumbnails for thumbnail navigation"
          ></app-help-button>
        </div>
        <div class="cv-settings-group">
          <p class="cv-settings-label">Manage library content</p>
          <div class="cv-settings-actions">
            <app-scan-lib-button [mini]="false"></app-scan-lib-button>
            <app-clean-lib-button
              appHideRoles
              [appHideForRoles]="[Role.Contributor, Role.Requester, Role.Viewer]"
              [mini]="false"
            ></app-clean-lib-button>
            <app-delete-lib-button
              appHideRoles
              [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
              [mini]="false"
            ></app-delete-lib-button>
          </div>
        </div>
      </div>
    </div>
    </section>
    <section class="cv-settings-section">
      <app-expander-button title="Appearance & UI" (buttonClicked)="toggleShowTheme()"
        [settingsStyle]="true"
        [open]="showTheme"
        description="Color theme, dark mode and pagination"
        panelId="settings-showTheme"
      ></app-expander-button>
      <div id="settings-showTheme" [hidden]="!showTheme">
      <div class="cv-settings-panel">
        <app-boolean-slider
          type="ngModel"
          [(value)]="darkMode"
          (valueChange)="darkModeService.setDarkMode($event)"
          label="Dark mode"
        ></app-boolean-slider>
        <fieldset class="cv-settings-group">
          <legend class="mb-2 text-sm font-medium text-generic-text">Color theme</legend>
          <div class="cv-palette-grid">
            @for (palette of darkModeService.palettes; track palette.id) {
              <label class="cv-palette-option" [attr.data-preview-palette]="palette.id">
                <input type="radio" name="colorPalette" [value]="palette.id"
                  [checked]="darkModeService.palette() === palette.id"
                  (change)="darkModeService.setPalette(palette.id)" />
                <span class="cv-palette-swatch" aria-hidden="true"></span>
                <span>{{ palette.label }}</span>
              </label>
            }
          </div>
          <p class="cv-settings-hint">Applies to both light and dark mode. Saved on this browser.</p>
        </fieldset>
        <div class="cv-settings-row">
          <label class="cv-settings-label" for="pagination-ratio">Provider pages per app page</label>
          <app-help-button
            message="Adjust the ratio of provider pages per app page for better reading comfort."
          ></app-help-button>
        </div>
        <app-digit-input
          id="pagination-ratio"
          accessibleLabel="Provider pages per app page"
          [(value)]="paginationRatio"
          (valueChange)="updatePaginationRatio()"
        ></app-digit-input>
      </div>
    </div>
    </section>
    <section class="cv-settings-section"
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]">
      <app-expander-button
      title="Slack"
      (buttonClicked)="toggleShowSlack()"
        [settingsStyle]="true"
        [open]="showSlack"
        description="Notification settings and webhook"
        panelId="settings-showSlack"
      ></app-expander-button>
      <div id="settings-showSlack" [hidden]="!showSlack">
      <div class="cv-settings-panel">
        <div>
          <app-boolean-slider
            type="ngModel"
            [(value)]="slackConfiguration.enableNotifications"
            (valueChange)="sendEnableNotifications()"
            label="Enable Slack notifications"
          ></app-boolean-slider>
        </div>
        <div>
          <app-input-text
            [(value)]="slackConfiguration.comicVaultBaseUrl"
            (valueChange)="resetSlackStatus$.next()"
            title="ComicVault base url for notifications"
            id="comicVaultBaseUrl"
            helpMessage="Fill in your ComicVault app’s domain or local IP to generate direct Slack notification links"
          ></app-input-text>
        </div>
        <div>
          <app-input-text
            [(value)]="slackConfiguration.slackWebHook"
            (valueChange)="resetSlackStatus$.next()"
            title="Slack webhook"
            id="slackWebHook"
          ></app-input-text>
        </div>
        <div class="cv-settings-submit">
          <app-test-button
            test="slack"
            [payload]="slackConfiguration"
            [resetStatus$]="resetSlackStatus$"
          ></app-test-button>
        </div>
      </div>
    </div>
    </section>
    <section class="cv-settings-section"
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]">
      <app-expander-button
      title="Comic Providers"
      (buttonClicked)="toggleComicProviders()"
        [settingsStyle]="true"
        [open]="showComicProviders"
        description="Provider connection and request limits"
        panelId="settings-showComicProviders"
      ></app-expander-button>
      <div id="settings-showComicProviders" [hidden]="!showComicProviders">
      <div class="cv-settings-panel">
        <div>
          <h2 class="text-lg text-generic-text mb-2">GetComics</h2>
          <div class="cv-settings-provider">
            <app-input-text
              [(value)]="getcomicsBaseUrl"
              title="Base URL"
              id="getcomicsBaseUrl"
            ></app-input-text>
            <div class="cv-settings-row">
              <label class="cv-settings-label" for="getComicsRequestsPerSecond">Requests per second</label>
              <app-help-button
                message="Adjust the number of requests per second. Setting this too high may cause 'Too Many Requests' errors. A value of 1 means one request per second, 0.5 means one request every two seconds, etc."
              ></app-help-button>
            </div>
            <app-digit-input
              id="getComicsRequestsPerSecond"
              accessibleLabel="Requests per second"
              [(value)]="getComicsRequestsPerSecond"
            ></app-digit-input>
            <div class="cv-settings-submit">
              <app-test-button
                test="getcomicsBaseUrl"
                [payload]="{
                  baseUrl: getcomicsBaseUrl,
                  requestsPerSecond: getComicsRequestsPerSecond,
                }"
              ></app-test-button>
            </div>
          </div>
        </div>
      </div>
    </div>
    </section>
    <section class="cv-settings-section"
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]">
      <app-expander-button
      title="ComicVine"
      (buttonClicked)="toggleShowComicVine()"
        [settingsStyle]="true"
        [open]="showComicVine"
        description="Metadata integration and API key"
        panelId="settings-showComicVine"
      ></app-expander-button>
      <div id="settings-showComicVine" [hidden]="!showComicVine">
      <div class="cv-settings-panel">
        <div>
          <app-input-text
            [(value)]="comicVineAPIKey"
            (valueChange)="resetComicVineStatus$.next()"
            title="ComicVine API key"
            id="comicVineApiKey"
            helpMessage="Set your ComicVine API key to enable ComicVine metadata fetching. You can obtain an API key from the ComicVine website"
          ></app-input-text>
        </div>
        <div class="cv-settings-submit">
          <app-test-button
            test="comicvine"
            [payload]="comicVineAPIKey"
            [resetStatus$]="resetComicVineStatus$"
          ></app-test-button>
        </div>
      </div>
    </div>
    </section>
    <section class="cv-settings-section"
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]">
      <app-expander-button
      title="JDownloader"
      (buttonClicked)="toggleJDownloader()"
        [settingsStyle]="true"
        [open]="showJDownloader"
        description="Download paths and cleanup"
        panelId="settings-showJDownloader"
      ></app-expander-button>
      <div id="settings-showJDownloader" [hidden]="!showJDownloader">
      <div class="cv-settings-panel">
        <div>
          <app-input-text
            [(value)]="jdownloaderConfiguration.jdownloaderCrawljobPath"
            (valueChange)="resetJdownloaderStatus$.next()"
            title="JDownloader crawljob path"
            id="crawljobPath"
            helpMessage="Folder path where crawl jobs are added for JDownloader (as seen inside the ComicVault Docker container if applicable)"
          ></app-input-text>
        </div>
        <div>
          <app-input-text
            [(value)]="jdownloaderConfiguration.jdownloaderOutputPath"
            (valueChange)="resetJdownloaderStatus$.next()"
            title="JDownloader output path"
            id="outputPath"
            helpMessage="Folder path where JDownloader outputs downloads. Set this to match ComicVault’s main Comics path (considering Docker specifics)"
          ></app-input-text>
        </div>
        <div class="cv-settings-row">
          <app-boolean-slider
            type="ngModel"
            [(value)]="jdownloaderConfiguration.deleteFolderOutputFolder"
            label="Delete output folder when finished"
          ></app-boolean-slider>
          <app-help-button
            message="ComicVault will delete JDownloader’s output download folder contents (does not remove jobs from JDownloader)"
          ></app-help-button>
        </div>
        <div class="cv-settings-submit">
          <app-test-button
            test="jdownloader"
            [payload]="jdownloaderConfiguration"
            [resetStatus$]="resetJdownloaderStatus$"
          ></app-test-button>
        </div>
      </div>
    </div>
    </section>
    <section class="cv-settings-section"
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]">
      <app-expander-button
      title="Advanced"
      (buttonClicked)="toggleAdvanced()"
        [settingsStyle]="true"
        [open]="showAdvanced"
        description="Server information, jobs and logs"
        panelId="settings-showAdvanced"
      ></app-expander-button>
      <div id="settings-showAdvanced" [hidden]="!showAdvanced">
      <div class="cv-settings-panel">
        <div class="cv-settings-group">
          <div class="cv-settings-actions">
            <button
              type="button"
              class="cv-settings-action"
              (click)="displayServerInfo()"
            >
              <svg
                class="w-5 h-5 me-2 -ms-1"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  fill-rule="evenodd"
                  d="M5 5a2 2 0 0 0-2 2v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a2 2 0 0 0-2-2H5Zm9 2a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H14Zm3 0a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H17ZM3 17v-3a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Zm11-2a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H14Zm3 0a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H17Z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              Display server info
            </button>
            <button
              type="button"
              class="cv-settings-action"
              routerLink="jobs"
            >
              <svg
                class="w-5 h-5 me-2 -ms-1"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  fill-rule="evenodd"
                  d="M10 2a3 3 0 0 0-3 3v1H5a3 3 0 0 0-3 3v2.382l1.447.723.005.003.027.013.12.056c.108.05.272.123.486.212.429.177 1.056.416 1.834.655C7.481 13.524 9.63 14 12 14c2.372 0 4.52-.475 6.08-.956.78-.24 1.406-.478 1.835-.655a14.028 14.028 0 0 0 .606-.268l.027-.013.005-.002L22 11.381V9a3 3 0 0 0-3-3h-2V5a3 3 0 0 0-3-3h-4Zm5 4V5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v1h6Zm6.447 7.894.553-.276V19a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-5.382l.553.276.002.002.004.002.013.006.041.02.151.07c.13.06.318.144.557.242.478.198 1.163.46 2.01.72C7.019 15.476 9.37 16 12 16c2.628 0 4.98-.525 6.67-1.044a22.95 22.95 0 0 0 2.01-.72 15.994 15.994 0 0 0 .707-.312l.041-.02.013-.006.004-.002.001-.001-.431-.866.432.865ZM12 10a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H12Z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              Display jobs
            </button>
            <button
              type="button"
              class="cv-settings-action"
              routerLink="logs"
            >
              <svg
                class="w-5 h-5 me-2 -ms-1"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  fill-rule="evenodd"
                  d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6Zm4.996 2a1 1 0 0 0 0 2h.01a1 1 0 1 0 0-2h-.01ZM11 8a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-6Zm-4.004 3a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2h-.01ZM11 11a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-6Zm-4.004 3a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2h-.01ZM11 14a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-6Z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              Display log
            </button>
            <button
              type="button"
              class="cv-settings-action"
              routerLink="exceptions"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5 me-2 -ms-1"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
                />
              </svg>
              Display exceptions
            </button>
          </div>
        </div>
      </div>
    </div>
    </section>
    </div>
  </div>
</div>
