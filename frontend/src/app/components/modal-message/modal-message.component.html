<div class="cv-dialog" role="dialog" aria-label="Confirm action">
<header class="cv-dialog-header"><h2>Confirm action</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
<p class="cv-dialog-message">{{ data?.message }}</p>
</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-deactivated" (click)="confirm(false)">Cancel</button><button type="button" class="button-text button-error" (click)="confirm(true)">Confirm</button></footer>
</div>
