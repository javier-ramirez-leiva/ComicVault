<a
  [ngClass]="{
    'bg-nav-menu-button-active': (activePageService.activePage$ | async) === activeRoute,
  }"
  class="flex items-center left-menu-button group"
  [attr.aria-current]="(activePageService.activePage$ | async) === activeRoute ? 'page' : null"
  [routerLink]="route"
  [queryParams]="queryParams"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    class="size-5 shrink-0"
  >
    <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="svgPath"></path>
  </svg>
  <span class="ms-3 truncate">{{ label }}</span>
</a>
