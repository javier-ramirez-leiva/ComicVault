<div
  class="cv-mobile-dock fixed z-40 bottom-0 inset-x-0 md:hidden"
>
  <app-bottom-drawer-buttons
    [open]="drawerOpen"
    (onDrawerOpen)="onDrawerOpen($event)"
  ></app-bottom-drawer-buttons>
</div>
@if (drawerOpen) {
<button type="button" class="cv-mobile-backdrop fixed inset-0 z-[39] md:hidden" aria-label="Close navigation" (click)="onDrawerOpen(false)"></button>
<div class="cv-mobile-sheet fixed z-40 inset-x-0 md:hidden" (keydown.escape)="onDrawerOpen(false)">
  <div class="cv-sheet-header"><span>Menu</span><button type="button" class="cv-icon-control" aria-label="Close menu" (click)="onDrawerOpen(false)">&#215;</button></div>
  <ul
    class="cv-mobile-sheet-list"
  >
    <li>
      <app-bottom-drawer-line label="Home" route="home" activeRoute="home"></app-bottom-drawer-line>
    </li>
    <li>
      <app-bottom-drawer-line
        label="Library"
        activeRoute="library"
        route="library"
      ></app-bottom-drawer-line>
    </li>
    <li
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
    >
      <app-bottom-drawer-line
        label="Advanced library"
        route="advanceLibrary"
        activeRoute="advanceLibrary"
      ></app-bottom-drawer-line>
    </li>
    <li>
      <app-bottom-drawer-line
        label="Search"
        route="search"
        activeRoute="search"
        [queryParams]="{ category: 'all' }"
      ></app-bottom-drawer-line>
    </li>
    <li>
      <app-bottom-drawer-line
        label="Downloads"
        route="downloads"
        activeRoute="downloads"
      ></app-bottom-drawer-line>
    </li>
    <li
      appHideRoles
      [appHideForRoles]="[Role.Owner, Role.Contributor, Role.Requester, Role.Viewer]"
    >
      <app-bottom-drawer-line
        label="Users"
        route="users"
        activeRoute="users"
      ></app-bottom-drawer-line>
    </li>
    <li>
      <app-bottom-drawer-line
        label="Devices"
        route="devices"
        activeRoute="devices"
      ></app-bottom-drawer-line>
    </li>
    <li>
      <app-bottom-drawer-line
        label="Settings"
        route="settings"
        activeRoute="settings"
      ></app-bottom-drawer-line>
    </li>
    <li>
      <app-bottom-drawer-line
        label="Sign Out"
        route="login"
        activeRoute="login"
      ></app-bottom-drawer-line>
    </li>
  </ul>
</div>
}
