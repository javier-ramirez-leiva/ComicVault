<button
  type="button"
  class="cv-dock-item w-full h-full"
  [routerLink]="route"
  [attr.aria-current]="(activePageService.activePage$ | async) === activeRoute ? 'page' : null"
  [queryParams]="queryParams"
>
  <svg
    class="size-5"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="currentColor"
    viewBox="0 0 20 20"
    [class.text-nav-menu-bottom-icon-active]="
      (activePageService.activePage$ | async) === activeRoute
    "
  >
    <path [attr.d]="svgPath"></path>
  </svg>
  <span>{{ label }}</span>
</button>
