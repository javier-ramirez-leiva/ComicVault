<div class="cv-dialog" role="dialog" aria-label="Reading mode">
<header class="cv-dialog-header"><h2>Reading mode</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
    <div class="cv-dialog-option">
      <app-radio-button-input
        label="Read"
        [value]="false"
        (valueChange)="confirm('read')"
      ></app-radio-button-input>
    </div>
    <div class="cv-dialog-option">
      <app-radio-button-input
        label="Read incognito"
        [value]="false"
        (valueChange)="confirm('incognito')"
      ></app-radio-button-input>
    </div>
    <div class="cv-dialog-option">
      <app-radio-button-input
        label="Read from the beginning"
        [value]="false"
        (valueChange)="confirm('beginning')"
      ></app-radio-button-input>
    </div>
  
</div>
</div>
