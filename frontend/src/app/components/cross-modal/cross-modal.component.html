<button
  (click)="closeModal()"
  type="button"
  aria-label="Close dialog" class="cv-dialog-close text-modal-title-cross-text hover:bg-modal-title-cross-hover hover:text-modal-title-cross-hover-text"
>
  <svg
    class="w-4 h-4"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 14 14"
  >
    <path
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
    ></path>
  </svg>
  <span class="sr-only">Close modal</span>
</button>
