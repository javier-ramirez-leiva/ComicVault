@if (authService.user$ | async; as user) {
  <div class="cv-avatar-wrapper" appOutsideClick (outsideClick)="hideDropdown()" (keydown.escape)="hideDropdown()">
  <app-avatar-user
    size="large"
    [username]="user.username"
    [color]="user.color"
    (onClick)="toggleDropdown()"
  ></app-avatar-user>
  @if (displayyDropdown) {
    <div
      class="cv-popover"

    >
      <div class="cv-popover-header">
        <div class="font-semibold truncate">{{ user.username }}</div>
        <div class="text-xs text-nav-menu-bottom-icon truncate">{{ user.role }}</div>
      </div>
      <ul class="cv-popover-items">
        <li>
          <button type="button"
            (click)="toggleDarkMode()"
            class="cv-menu-item"
          >
            Toggle light / dark
          </button>
        </li>
        <li>
          <a [routerLink]="['/settings']" class="cv-menu-item">Appearance</a>
        </li>
        <li>
          <a [routerLink]="['/user']" class="cv-menu-item">
            User Settings
          </a>
        </li>
      </ul>
      <div class="py-1">
        <a
          [routerLink]="['/login']"
          class="cv-menu-item cv-danger-item"
        >
          Sign out
        </a>
      </div>
    </div>
  }
  </div>
}
