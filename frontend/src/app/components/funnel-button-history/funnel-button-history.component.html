<app-right-panel-funnel-button
  [expanded]="(isDrawerOpen$ | async) === true"
  panelId="funnel-button-history-panel"
  (funnelButtonClicked)="onOpenDrawer()"
></app-right-panel-funnel-button>
<button type="button" class="right-panel-mask" aria-label="Close filters" tabindex="-1"
  [class.hidden]="!(isDrawerOpen$ | async)" (click)="onCloseDrawer()"></button>
<div id="funnel-button-history-panel" role="dialog" aria-label="Reading history filters"
  [attr.inert]="(isDrawerOpen$ | async) ? null : ''"
  class="right-panel-container bg-right-panel-background"
  [ngClass]="{
    'translate-x-full': !(isDrawerOpen$ | async),
    '-translate-x-0': (isDrawerOpen$ | async),
  }"
>
  <app-right-panel-title title="Reading history filters" (onCloseClick)="onCloseDrawer()"></app-right-panel-title>

  <form [formGroup]="form" class="cv-filter-form">
    <div class="cv-filter-fields text-right-panel-text">
      <div class="space-y-2">
        <app-input-text-form id="comicTitle" formControlName="comicTitle" title="Comic Title">
        </app-input-text-form>
      </div>
      <div class="space-y-2">
        <h6 class="text-base font-medium">Date</h6>
        <div class="min-w-0">
          <app-date-text-form
            id="date-start"
            title="From"
            formControlName="dateStart"
          ></app-date-text-form>
        </div>
        <div class="min-w-0">
          <app-date-text-form
            id="date-end"
            title="To"
            formControlName="dateEnd"
          ></app-date-text-form>
        </div>
      </div>

      <!-- Read Status -->
      <div class="space-y-2">
        <h6 class="text-base font-medium">Read Status</h6>
        <div class="flex items-center">
          <app-boolean-slider-form
            formControlName="readStatusOnGoing"
            label="In progress"
          ></app-boolean-slider-form>
        </div>
        <div class="flex items-center">
          <app-boolean-slider-form
            formControlName="readStatusRead"
            label="Read"
          ></app-boolean-slider-form>
        </div>
      </div>
      <!-- InLibrary -->
      <div class="space-y-2">
        <h6 class="text-base font-medium">In Library</h6>
        <div class="flex items-center">
          <app-boolean-slider-form
            formControlName="inLibraryYes"
            label="Yes"
          ></app-boolean-slider-form>
        </div>
        <div class="flex items-center">
          <app-boolean-slider-form
            formControlName="inLibraryNo"
            label="No"
          ></app-boolean-slider-form>
        </div>
      </div>
    </div>
  </form>
  <footer class="cv-filter-footer">
    <p>Changes are applied when you close this panel.</p>
    <button type="button" class="cv-account-action cv-account-primary" (click)="onCloseDrawer()">Apply filters</button>
  </footer>
</div>
