<div class="cv-dialog" role="dialog" aria-label="Reader settings">
<header class="cv-dialog-header"><h2>Reader settings</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
    <form [formGroup]="form">
      <div
        class="cv-dialog-fields"
        formGroupName="readerSettingsService"
      >
        <app-boolean-slider-form
          formControlName="thumbnailNavigation"
          label="Use thumbnail navigation"
        ></app-boolean-slider-form>
        <app-boolean-slider-form
          formControlName="gestures"
          label="Use gestures"
        ></app-boolean-slider-form>
        <app-boolean-slider-form
          formControlName="resetZoom"
          label="Reset zoom when changing orientation (reloads the reader)"
        ></app-boolean-slider-form>
        <app-boolean-slider-form
          formControlName="noMenuZoom"
          label="Menu is not displayed when zoom"
        ></app-boolean-slider-form>
      </div>
      <div class="cv-dialog-field">
        <label for="doublePageConfiguration" class="block mb-2 text-sm font-medium text-generic-text">
          Double page configuration
        </label>
        <select
          id="doublePageConfiguration"
          formControlName="doublePageConfiguration"
          class="bg-input-select-background border border-input-select-border text-input-select-text text-sm rounded-lg focus:ring-input-select-focus-ring block w-full p-2.5 cursor-pointer"
        >
          <option value="single">Single</option>
          <option value="double">Double</option>
          <option value="auto">Auto</option>
        </select>
      </div>
    </form>
    <button
      appHideRoles
      [appHideForRoles]="[Role.Requester, Role.Viewer]"
      (click)="setCover()"
      class="button-text button-set-cover"
    >
      Set actual page as comic cover
    </button>

</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-primary" (click)="cancel()">Done</button></footer>
</div>
