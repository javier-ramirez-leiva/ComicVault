<div class="cv-dialog" role="dialog" aria-label="Download comics">
<header class="cv-dialog-header"><h2>Download comics</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
<p class="cv-dialog-message font-medium">{{ data?.comicTitle }}</p>
    @for (link of data?.options; track link) {
      <div class="cv-dialog-option">
        <app-radio-button-input
          [label]="link.platform"
          [value]="link"
          (valueChange)="updateLink($event)"
          [initValue]="data?.options?.[0]"
        ></app-radio-button-input>
      </div>
    }
  
</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-deactivated" (click)="cancel()">Cancel</button><button type="button" class="button-text button-primary" (click)="confirm()">Download</button></footer>
</div>
