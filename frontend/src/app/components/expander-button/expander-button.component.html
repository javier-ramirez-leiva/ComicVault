@if (settingsStyle) {
  <h2>
    <button type="button" class="cv-settings-expander" (click)="onButtonClick()"
      [attr.aria-expanded]="isExpanded()" [attr.aria-controls]="panelId">
      <span class="cv-settings-expander-copy">
        <span>{{ title }}</span>
        <span class="cv-settings-description">{{ description }}</span>
      </span>
      <svg class="cv-settings-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </h2>
} @else {
<h2>
  <button
    (click)="onButtonClick()"
    type="button"
    class="flex items-center justify-between w-full p-5 font-medium rtl:text-right bg-settings-menu-background text-settings-menu-button-text border border-settings-menu-border hover:bg-settings-menu-button-active gap-3 cursor-pointer"
    [ngClass]="{
      'rounded-t-lg': upperBorder,
      'rounded-b-lg': bottomBorder && !isExpanded(),
    }"
    [attr.aria-expanded]="isExpanded()"
  >
    <span class="flex items-center ml-8">{{ title }}</span>
    <svg
      class="w-3 h-3 rotate-180 shrink-0"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 10 6"
    >
      @if (isExpanded()) {
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M1 1 5 5 9 1"
        ></path>
      } @else {
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5 5 1 1 5"
        ></path>
      }
    </svg>
  </button>
</h2>
}
