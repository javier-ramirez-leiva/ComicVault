<div class="cv-dialog" role="dialog" aria-label="User settings">
<header class="cv-dialog-header"><h2>User settings</h2><app-cross-modal (onCloseClick)="cancelUser()"></app-cross-modal></header>
<div class="cv-dialog-body">
  <form class="cv-dialog-fields text-generic-text">
    <div>
      <app-input-text
        title="Username"
        [(value)]="user.username"
        [disabled]="!data?.input?.modifyUser"
        id="username"
      >
      </app-input-text>
    </div>
    <div>
      <app-input-text title="Password" [(value)]="user.password" [password]="true" id="password">
      </app-input-text>
    </div>
    <div class="cv-dialog-color-row">
      <p class="block text-sm font-medium">Avatar color</p>
      <div class="flex h-full justify-center">
        <app-input-color [(value)]="user.color"></app-input-color>
      </div>
    </div>
    @if (data?.input?.modifyRole === true) {
      <div class="cv-dialog-field">
        <label for="role" class="block mb-2 text-sm font-medium">Select a role</label>
        <div
          class="bg-input-select-background border border-input-select-border text-input-select-text text-sm rounded-lg focus:ring-input-select-focus-ring p-2.5"
        >
          <select id="role" [formControl]="roleControl" class="w-full cursor-pointer">
            <option value="ADMIN">ADMIN</option>
            <option value="OWNER">OWNER</option>
            <option value="CONTRIBUTOR">CONTRIBUTOR</option>
            <option value="REQUESTER">REQUESTER</option>
            <option value="VIEWER">VIEWER</option>
          </select>
        </div>
      </div>
    }
  </form>
</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-deactivated" (click)="cancelUser()">Cancel</button><button type="button" class="button-text button-primary" (click)="okUser()">Save</button></footer>
</div>
