@if (size === 'small') {
  <div
    class="relative inline-flex items-center justify-center size-8 overflow-hidden rounded-full cv-account-avatar"
    [ngStyle]="{ 'background-color': color }"
  >
    <span class="font-normal text-lg text-button-avatar-text">{{ username.charAt(0).toUpperCase() }}</span>
  </div>
  <span class="cv-avatar-name">{{ username }}</span>
}
@if (size === 'large') {
  <button
    aria-label="Account menu"
    type="button"
    class="relative inline-flex items-center justify-center w-11 h-11 overflow-hidden rounded-full cursor-pointer"
    [ngStyle]="{ 'background-color': color }"
    (click)="onClickHandler()"
  >
    @if (username) {
      <span class="font-medium text-button-avatar-text">
        {{ username.charAt(0).toUpperCase() }}
      </span>
    }
  </button>
}
