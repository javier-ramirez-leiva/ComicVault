<div
  class="cv-topbar md:pl-14 lg:pl-56 flex items-center bg-topBar fixed top-0 z-30 h-16 w-full max-w-full"
>
  <app-back-button class="text-topBar-left-corner"></app-back-button>

  <app-search-input
    [class.hidden]="!displaySettings.displaySearchInputLibrary"
    [searchButton]="false"
    class="flex-1 min-w-0"
    (textChange)="emitSeachTextChangeLibEvent($event)"
    [textModifier$]="topBarService.searchBarTextModifierLib$"
    placeholder="Search on library"
  ></app-search-input>

  <app-search-and-category
    [class.hidden]="!displaySettings.displaySearchInputSearch"
    class="flex-1 min-w-0"
  ></app-search-and-category>

  <app-funnel-button
    [class.hidden]="!displaySettings.displayFunnel"
    class="ml-auto"
    (filterChange)="emitFilterChange($event)"
    (contentChange)="emitContentChange($event)"
  ></app-funnel-button>
  @if (isAdmin$ | async) {
    <app-advance-funnel-button
      [class.hidden]="!displaySettings.displayAdvanceFunnel"
        class="ml-auto"
      (filterChange)="emitAdvanceFilterChange($event)"
      (contentChange)="emitContentChange($event)"
    ></app-advance-funnel-button>
  }
  @if (isAdmin$ | async) {
    <app-job-funnel-button
      [class.hidden]="!displaySettings.displayJobsFunnel"
        class="ml-auto"
      (filterChange)="emitJobFilterChange($event)"
      (contentChange)="emitContentChange($event)"
    ></app-job-funnel-button>
    <app-log-funnel-button
      [class.hidden]="!displaySettings.displayLogsFunnel"
        class="ml-auto"
      (filterChange)="emitLogFilterChange($event)"
      (contentChange)="emitContentChange($event)"
    ></app-log-funnel-button>
  }

  @if (displaySettings.displayGridButton) {
    <app-grid-button></app-grid-button>
  }

  <div class="ml-auto flex items-center shrink-0">
    <app-avatar-dropdown class="shrink-0"></app-avatar-dropdown>
  </div>
</div>
