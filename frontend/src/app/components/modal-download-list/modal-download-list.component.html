<div class="cv-dialog" role="dialog" aria-label="Download comics">
<header class="cv-dialog-header"><h2>Download comics</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
<p class="cv-dialog-message font-medium">{{ data?.comicTitle }}</p>
    @for (downloadIssue of data?.options; track downloadIssue) {
      <div class="cv-dialog-field">
        <form class="w-full">
          <label [attr.for]="'download-options-' + downloadIssue.idGcIssue" class="block mb-2 text-sm font-medium text-generic-text">{{
            downloadIssue.description
          }}</label>
          <select
            (change)="onPlatformChange($event, downloadIssue.idGcIssue)"
            [id]="'download-options-' + downloadIssue.idGcIssue"
            class="bg-input-select-background border border-input-select-border text-input-select-text text-sm rounded-lg focus:ring-input-select-focus-ring block w-full p-2.5 cursor-pointer"
          >
            @if (downloadIssue.links.length) {
              <option [value]="0" selected>
                {{ downloadIssue.links[0].platform }}
              </option>
              @for (item of downloadIssue.links.slice(1); track item; let i = $index) {
                <option [value]="i + 1">
                  {{ item.platform }}
                </option>
              }
            }
            <option [value]="-1">NONE</option>
          </select>
        </form>
      </div>
    }
  
</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-deactivated" (click)="cancel()">Cancel</button><button type="button" class="button-text button-primary" (click)="confirm()">Download</button></footer>
</div>
