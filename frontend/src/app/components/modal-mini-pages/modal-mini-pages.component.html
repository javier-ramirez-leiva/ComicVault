<div class="cv-dialog cv-dialog-pages" role="dialog" aria-label="Select page">
<header class="cv-dialog-header"><h2>Select page</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
      <ul class="grid-mini-pages">
        @for (index of range; track index) {
          <li>
            <button #image type="button" class="cv-dialog-page" [class.cv-dialog-page-selected]="index === page" [attr.aria-pressed]="index === page" (click)="updatePage(index)">
              @if (!imageErrors[index]) {
                <div class="flex items-center h-full">
                  <img
                    [src]="pagesURL + index" [alt]="'Page ' + index"
                    class="border-cover-card-active-border"
                    [class.border-4]="index === page"
                    (error)="imageErrors[index] = true"
                  />
                </div>
              } @else {
                <div
                  class="h-full aspect-[3/5] border-cover-card-active-border font-extrabold text-2xl flex justify-center items-center bg-background text-generic-text"
                  [class.border-4]="index === page"
                >
                  {{ index }}
                </div>
              }
              <div class="text-generic-text mt-2">{{ index }}</div>
            </button>
          </li>
        }
      </ul>

</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-deactivated" (click)="cancel()">Cancel</button><button type="button" class="button-text button-primary" (click)="confirm()">OK</button></footer>
</div>
