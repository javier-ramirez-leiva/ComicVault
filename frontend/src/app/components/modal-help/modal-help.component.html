<div class="cv-dialog" role="dialog" aria-label="Help">
<header class="cv-dialog-header"><h2>Help</h2><app-cross-modal (onCloseClick)="cancel()"></app-cross-modal></header>
<div class="cv-dialog-body">
<p class="cv-dialog-message">{{ data?.message }}</p>
</div>
<footer class="cv-dialog-actions"><button type="button" class="button-text button-primary" (click)="cancel()">OK</button></footer>
</div>
