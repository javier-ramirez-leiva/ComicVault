<!doctype html>
<html lang="en" class="dark" data-palette="ocean">
  <head>
    <meta charset="utf-8" />
    <title>ComicVault</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      // Restore appearance before Angular renders the first frame.
      try {
        const root = document.documentElement;
        root.classList.toggle('dark', JSON.parse(localStorage.getItem('darkMode')) !== 'null');
        const palette = JSON.parse(localStorage.getItem('colorPalette'));
        if (['ocean', 'forest', 'violet', 'sunset'].includes(palette)) {
          root.dataset.palette = palette;
        }
      } catch { /* Keep the default appearance if storage is unavailable. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/comicvault-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body id="body" class="bg-background">
    <app-root></app-root>
    <noscript> Please enable JavaScript to continue using this application. </noscript>

  </body>
</html>
